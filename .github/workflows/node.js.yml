name: Node.js CI

on:
  push:
    branches: [ "main", "feat/melhorias-ui-e-funcionalidades" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Baixar código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Instalar dependências
      run: npm install

    - name: Verificar se o servidor inicia
      run: |
        node server.js &
        sleep 5
        echo "Servidor iniciou com sucesso"
