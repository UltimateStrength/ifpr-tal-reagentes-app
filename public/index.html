<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2f9e3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Reagentes IFPR</title>
  <link rel="icon" href="assets/img/icons/logo.png">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <style>
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div id="login-card">
      <img src="assets/img/icons/logo.png" alt="Logo" id="login-logo">
      <p id="login-title">Confirme sua identidade:</p>

      <label for="input-user">Usuário:</label>
      <input type="text" id="input-user" autocomplete="username">

      <label for="input-pass">Senha:</label>
      <input type="password" id="input-pass" autocomplete="current-password">

      <button id="btn-login">ENTRAR</button>
      <p id="login-error" hidden>Usuário ou senha incorretos.</p>

      <div id="login-bottom">
        <img src="assets/img/icons/ifpr.png" alt="IFPR" id="ifpr-logo">
        <a href="assets/pages/about.html" id="link-about">Sobre o app</a>
      </div>
    </div>
  </div>

  <div id="app" hidden>
    <main id="page-content"></main>

    <nav id="bottom-nav">
      <button class="nav-btn" data-page="home">
        <img src="assets/img/tabs/home.png" alt="Início">
        <span>INICIO</span>
      </button>
      <button class="nav-btn" data-page="substances">
        <img src="assets/img/tabs/reagents.png" alt="Substâncias">
        <span>SUBSTANCIAS</span>
      </button>
      <button class="nav-btn" data-page="add">
        <img src="assets/img/tabs/edit.png" alt="Adicionar">
        <span>EDITAR</span>
      </button>
      <button class="nav-btn" data-page="import">
        <img src="assets/img/tabs/options.png" alt="Importar">
        <span>OPÇÕES</span>
      </button>
      <button class="nav-btn" data-page="menu">
        <img src="assets/img/tabs/menu.png" alt="Menu">
        <span>MENU</span>
      </button>
    </nav>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>

</body>
</html>
