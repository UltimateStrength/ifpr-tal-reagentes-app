<div class="page" id="page-add">
  <p class="page-title">Adicionar embalagem</p>

  <div class="form-group">
    <label for="add-name">Nome da substância</label>
    <input
      type="text"
      id="add-name"
      placeholder="ex: Álcool Etílico"
      autocomplete="off"
    >
    <div id="add-suggestions" style="display:none;background:var(--white);
         border:1px solid #ddd;border-radius:8px;overflow:hidden;
         margin-top:2px;"></div>
  </div>

  <div class="form-group">
    <label for="add-qty">Quantidade</label>
    <input type="number" id="add-qty" placeholder="ex: 2" min="0.01" step="0.01">
  </div>

  <div class="form-group">
    <label for="add-expiry">Validade</label>
    <input type="date" id="add-expiry">
  </div>

  <button class="btn-primary" id="btn-add">Adicionar</button>
  <p id="add-feedback" style="text-align:center;margin-top:12px;
     font-size:0.85rem;color:var(--green);min-height:20px;"></p>
</div>
