<div id="page-substances">

  <!-- Barra de busca no topo -->
  <div style="padding:16px 16px 8px;background:var(--cream);
              position:sticky;top:0;z-index:10;">
    <div style="display:flex;gap:8px;">
      <input
        type="text"
        id="search-input"
        placeholder="digite o nome da substância"
        style="flex:1;background:var(--white);padding:12px 14px;
               border-radius:var(--radius);font-size:0.95rem;
               box-shadow:0 1px 4px rgba(0,0,0,0.08);
               border:2px solid transparent;"
      >
      <button id="btn-search" class="btn-primary"
              style="width:auto;padding:0 20px;border-radius:var(--radius);">
        buscar
      </button>
    </div>
  </div>

  <!-- Resultados -->
  <div id="substances-list" style="padding:8px 16px 32px;"></div>

</div>

<!-- Modal remoção -->
<div class="modal-overlay" id="remove-modal" hidden>
  <div class="modal-box">
    <p class="modal-title">Remover embalagem?</p>
    <p class="modal-message" id="modal-remove-msg"></p>
    <div class="modal-actions">
      <button class="modal-cancel"  id="modal-cancel">Cancelar</button>
      <button class="modal-confirm" id="modal-confirm">Remover</button>
    </div>
  </div>
</div>

<!-- Modal opções (3 riscos) -->
<div class="modal-overlay" id="options-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="options-modal-title">Opções</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
      <button class="btn-primary" id="opt-edit">✏️ Editar / adicionar embalagem</button>
      <button class="btn-danger"  id="opt-delete">🗑️ Deletar embalagem</button>
      <button class="btn-secondary" id="opt-cancel">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal quick add -->
<div class="modal-overlay" id="quick-add-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="quick-add-title">Adicionar embalagem</p>

    <div class="form-group">
      <label for="qa-qty">Quantidade</label>
      <input type="number" id="qa-qty" min="0.01" step="0.01" placeholder="ex: 2">
    </div>

    <div class="form-group" style="margin-bottom:0">
      <label for="qa-expiry">Validade</label>
      <input type="date" id="qa-expiry">
    </div>

    <div class="modal-actions" style="margin-top:20px;">
      <button class="modal-cancel" id="qa-cancel">Cancelar</button>
      <button class="modal-ok"     id="qa-confirm">Adicionar</button>
    </div>
  </div>
</div>
