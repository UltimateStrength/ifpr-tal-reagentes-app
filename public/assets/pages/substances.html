<div id="page-substances">
    <div style="display:flex;gap:8px;">
      <div class="search-wrap">
        <input type="text" id="search-input"
               placeholder="Nome, CAS, número ou tag"
               autocomplete="off"
               style="background:var(--white);padding:12px 14px;
                      border-radius:var(--radius);font-size:0.95rem;
                      box-shadow:0 1px 4px rgba(0,0,0,0.08);
                      border:2px solid transparent;">
        <span class="search-clear" id="search-clear">✕</span>
        <div id="search-tags-suggestions"
             style="display:none;position:absolute;left:0;right:0;top:100%;
                    background:var(--white);border:1px solid #ddd;
                    border-radius:var(--radius-sm);overflow:hidden;
                    margin-top:2px;box-shadow:0 2px 8px rgba(0,0,0,0.1);
                    z-index:10;"></div>
      </div>
      <button id="btn-search" class="btn-primary"
              style="width:auto;padding:0 20px;border-radius:var(--radius);">
        Buscar
      </button>
    </div>
    <div style="margin-top:8px;">
      <select id="filter-select"
              style="width:100%;background:var(--white);padding:10px 12px;
                     border-radius:var(--radius);font-size:0.85rem;
                     border:2px solid transparent;">
        <option value="">Sem filtro</option>
        <option value="recent">Mais recentes</option>
        <option value="oldest">Mais antigos</option>
        <option value="expiring">Mais próximos de vencer</option>
        <option value="pf">Controlados pela PF</option>
        <option value="aberto">Abertos</option>
        <option value="fechado">Fechados</option>
      </select>
    </div>

  <div id="substances-list" style="padding:8px 16px 32px;"></div>
</div>

<!-- Modal remoção -->
<div class="modal-overlay" id="remove-modal" hidden>
  <div class="modal-box">
    <p class="modal-title">Remover embalagem?</p>
    <div id="modal-remove-msg" style="margin-bottom:16px;"></div>
    <div class="modal-actions">
      <button class="modal-cancel"  id="modal-cancel">Cancelar</button>
      <button class="modal-confirm" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal opções (3 riscos) -->
<div class="modal-overlay" id="options-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="options-modal-title">Opções</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
      <button class="btn-primary"   id="opt-edit">Adicionar embalagem</button>
      <button class="btn-secondary" id="opt-edit-pkg">Editar embalagem</button>
      <button class="btn-secondary" id="opt-edit-sub">Editar informações gerais</button>
      <button class="btn-secondary" id="opt-consumo">Registrar uso</button>
      <button class="btn-danger"    id="opt-delete">Remover</button>
      <button class="btn-secondary" id="opt-cancel">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal quick add -->
<div class="modal-overlay" id="quick-add-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="quick-add-title">Adicionar</p>

    <!-- Quantidade + Unidade lado a lado -->
    <div style="display:flex;gap:10px;">
      <div class="form-group" style="flex:2;">
        <label for="qa-qty">Quantidade</label>
        <input type="number" id="qa-qty" min="0.01" step="0.01" placeholder="ex: 2">
      </div>
      <div class="form-group" style="flex:1;">
        <label for="qa-unit">Unidade</label>
        <select id="qa-unit">
          <option value="un">un</option>
          <option value="L">L</option>
          <option value="mL">mL</option>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="mg">mg</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="qa-expiry">Validade</label>
      <input type="date" id="qa-expiry">
    </div>

    <div class="form-group" style="margin-bottom:0">
      <label for="qa-arrival">Data de chegada</label>
      <input type="date" id="qa-arrival">
    </div>

    <div class="modal-actions" style="margin-top:20px;">
      <button class="modal-cancel" id="qa-cancel">Cancelar</button>
      <button class="modal-ok"     id="qa-confirm">Adicionar</button>
    </div>
  </div>
</div>

<!-- Modal editar embalagem existente -->
<div class="modal-overlay" id="edit-pkg-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="edit-pkg-title">Editar embalagem</p>

    <div id="edit-pkg-list"
         style="margin-bottom:16px;max-height:180px;overflow-y:auto;"></div>

    <div id="edit-pkg-form" hidden>

      <!-- Quantidade + Unidade lado a lado -->
      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:2;">
          <label for="epf-qty">Quantidade</label>
          <input type="number" id="epf-qty" min="0.01" step="0.01">
        </div>
        <div class="form-group" style="flex:1;">
          <label for="epf-unit">Unidade</label>
          <select id="epf-unit">
            <option value="un">un</option>
            <option value="L">L</option>
            <option value="mL">mL</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="mg">mg</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="epf-expiry">Validade</label>
        <input type="date" id="epf-expiry">
      </div>

      <div class="form-group">
        <label for="epf-arrival">Data de chegada</label>
        <input type="date" id="epf-arrival">
      </div>

      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1;">
          <label for="epf-armario">Armário <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
          <select id="epf-armario">
            <option value="">—</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;">
          <label for="epf-situacao">Situação <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
          <select id="epf-situacao">
            <option value="">—</option>
            <option value="fechado">Fechado</option>
            <option value="aberto">Aberto</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="epf-local">Local atual <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <input type="text" id="epf-local" placeholder="ex: Sala de reagentes" autocomplete="off">
      </div>

      <div class="form-group" style="margin-bottom:0">
        <label for="epf-marca">Marca <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <input type="text" id="epf-marca" placeholder="ex: Reatec" autocomplete="off">
      </div>

    </div>

    <div class="modal-actions" style="margin-top:16px;">
      <button class="modal-cancel" id="epf-cancel">Cancelar</button>
      <button class="modal-ok"     id="epf-confirm" hidden>Salvar</button>
    </div>
  </div>
</div>

<!-- Modal editar substância (campos de nível de grupo) -->
<div class="modal-overlay" id="edit-sub-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="edit-sub-title">Editar substância</p>

    <div class="form-group">
      <label for="es-number">Número de referência</label>
      <div style="display:flex;gap:10px;align-items:center;">
        <input type="number" id="es-number" min="1" step="1" disabled style="flex:1;">
        <label for="es-number-unlock"
               style="display:flex;align-items:center;gap:6px;
                      font-size:0.8rem;font-weight:400;white-space:nowrap;margin:0;">
          <input type="checkbox" id="es-number-unlock" style="width:16px;height:16px;">
          editar manualmente
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="es-cas">CAS <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
      <input type="text" id="es-cas" placeholder="ex: 64-17-5" autocomplete="off">
    </div>

    <div class="form-group form-check">
      <input type="checkbox" id="es-pf">
      <label for="es-pf">Controlado pela Polícia Federal</label>
    </div>

    <div class="form-group">
      <label for="es-tags">Tags <span style="color:var(--muted);font-weight:400;">(opcional, separadas por vírgula)</span></label>
      <input type="text" id="es-tags" placeholder="ex: inflamável, uso frequente" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="es-obs">Observações <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
      <textarea id="es-obs" rows="3" style="width:100%;padding:12px;border-radius:var(--radius-sm);
                font-family:inherit;font-size:0.95rem;border:2px solid transparent;
                background:var(--card-bg);resize:vertical;"></textarea>
    </div>

    <div class="form-group" style="margin-bottom:0">
      <label for="es-incompat">Incompatibilidades <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
      <textarea id="es-incompat" rows="2" placeholder="ex: não misturar com ácidos fortes"
                style="width:100%;padding:12px;border-radius:var(--radius-sm);
                font-family:inherit;font-size:0.95rem;border:2px solid transparent;
                background:var(--card-bg);resize:vertical;"></textarea>
    </div>

    <div class="modal-actions" style="margin-top:16px;">
      <button class="modal-cancel" id="es-cancel">Cancelar</button>
      <button class="modal-ok"     id="es-confirm">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal registrar uso (consumo) -->
<div class="modal-overlay" id="consumo-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="consumo-modal-title">Registrar uso</p>

    <div id="consumo-pkg-list"
         style="margin-bottom:16px;max-height:180px;overflow-y:auto;"></div>

    <div id="consumo-form" hidden>
      <p style="font-size:0.82rem;color:var(--muted);margin-bottom:12px;">
        Restante calculado: <strong id="consumo-restante" style="color:var(--text);"></strong>
      </p>

      <div class="form-group">
        <label for="cons-amount">Quantidade usada</label>
        <input type="number" id="cons-amount" min="0.01" step="0.01" placeholder="ex: 0.5">
      </div>

      <div class="form-group" style="margin-bottom:0">
        <label for="cons-note">Observação <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <input type="text" id="cons-note" placeholder="ex: usado em aula prática" autocomplete="off">
      </div>

      <div class="form-group form-check" style="margin-top:14px;margin-bottom:0;">
        <input type="checkbox" id="cons-queue">
        <label for="cons-queue">
          Marcar como quase acabando (entra na fila de solicitações)
        </label>
      </div>
    </div>

    <div class="modal-actions" style="margin-top:16px;">
      <button class="modal-cancel" id="cons-cancel">Cancelar</button>
      <button class="modal-ok"     id="cons-confirm" hidden>Registrar</button>
    </div>
  </div>
</div>
