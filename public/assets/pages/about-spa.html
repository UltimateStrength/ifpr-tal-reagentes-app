<div id="page-about"
     style="min-height:calc(100dvh - var(--nav-h));
            display:flex;flex-direction:column;
            background:var(--cream);">

  <div style="display:flex;align-items:center;gap:12px;
              padding:16px;background:var(--white);
              border-bottom:1px solid var(--card-bg);">
    <button id="about-back"
            style="font-size:1.4rem;color:var(--text);line-height:1;
                   background:none;border:none;cursor:pointer;">←</button>
    <p style="font-size:1rem;font-weight:700;">Sobre o app</p>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;
              justify-content:center;flex:1;
              padding:48px 24px;gap:12px;text-align:center;">

    <img src="assets/img/icons/logo.png" alt=""
         onerror="this.style.display='none'"
         style="width:90px;height:90px;object-fit:contain;border-radius:18px;">

    <p style="font-size:1.2rem;font-weight:800;margin-top:8px;">Reagentes IFPR</p>
    <p style="font-size:0.85rem;color:var(--muted);">Versão 0.3.1</p>

    <img src="assets/img/icons/ifpr.png" alt=""
         onerror="this.style.display='none'"
         style="width:80px;margin-top:32px;">
  </div>

</div>
