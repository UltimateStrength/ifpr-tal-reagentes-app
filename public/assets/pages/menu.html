<div id="page-menu">

  <!-- Abas -->
  <div id="menu-tabs">
    <button class="menu-tab active" data-tab="info">App</button>
    <button class="menu-tab"       data-tab="actions">Opções</button>
  </div>

  <!-- Aba: Info -->
  <div id="tab-info" class="tab-panel">
    <div id="menu-info-card">
      <img src="assets/img/icons/logo.png" alt="Logo" id="menu-logo">
      <p id="menu-appname">Reagentes IFPR</p>
      <p id="menu-version">Versão 1.0.0</p>
    </div>
    <img src="assets/img/icons/ifpr.png" alt="IFPR" id="menu-ifpr">
  </div>

  <!-- Aba: Ações -->
  <div id="tab-actions" class="tab-panel" hidden>
    <div id="menu-grid">

      <button class="menu-grid-btn" id="btn-export">
        <div class="menu-grid-icon">⬇️</div>
        <span>Exportar backup</span>
      </button>

      <label class="menu-grid-btn" id="label-restore" for="restore-file">
        <div class="menu-grid-icon">📂</div>
        <span>Restaurar backup</span>
        <input type="file" id="restore-file" accept=".json" hidden>
      </label>

      <button class="menu-grid-btn" id="btn-logout">
        <div class="menu-grid-icon logout-icon">↪</div>
        <span>Sair do app</span>
      </button>

    </div>
  </div>

  <p id="menu-feedback"
     style="text-align:center;padding:16px;font-size:0.85rem;
            color:var(--green);min-height:20px;"></p>
</div>
