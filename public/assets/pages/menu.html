<div id="page-menu">

  <div style="display:flex;align-items:center;gap:16px;
              padding:28px 20px 24px;background:var(--white);
              border-bottom:1px solid var(--card-bg);">

    <!-- Logo — div placeholder enquanto não tem imagem -->
    <div style="width:72px;height:72px;flex-shrink:0;
                background:transparent;border-radius:14px;
                overflow:hidden;">
      <img src="assets/img/icons/logo.png" alt=""
           onerror="this.style.display='none'"
           style="width:100%;height:100%;object-fit:contain;padding:10px;">
    </div>

    <div style="flex:1;display:flex;flex-direction:column;
                align-items:flex-end;gap:2px;text-align:right;">
      <p id="menu-username"
         style="font-size:1.1rem;font-weight:800;color:var(--text);">—</p>
      <p id="menu-role"
         style="font-size:0.85rem;color:var(--muted);">—</p>
      <div style="height:1px;background:var(--card-bg);margin:8px 0;width:100%;"></div>
      <p style="font-size:0.8rem;font-weight:700;color:var(--text);">Versão 1.0.0</p>
      <p style="font-size:0.75rem;color:var(--muted);">IFPR Reagentes</p>
    </div>

  </div>

  <div id="menu-grid"
       style="display:grid;grid-template-columns:repeat(3,1fr);
              gap:14px;padding:20px 16px 32px;">
  </div>

  <p id="menu-feedback"
     style="text-align:center;padding:0 16px 16px;
            font-size:0.85rem;color:var(--green);min-height:20px;"></p>

  <input type="file" id="restore-file" accept=".json" hidden>
</div>
