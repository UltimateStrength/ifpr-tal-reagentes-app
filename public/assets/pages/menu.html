<div id="page-menu">

  <!-- Header com info do usuário -->
  <div style="display:flex;align-items:center;gap:14px;
              padding:20px 16px 16px;background:var(--white);
              border-bottom:1px solid var(--card-bg);">
    <img src="assets/img/icons/logo.png" alt="Logo"
         style="width:56px;height:56px;object-fit:contain;
                background:var(--red);border-radius:12px;padding:6px;">
    <div style="flex:1;">
      <p id="menu-username"
         style="font-size:1rem;font-weight:700;color:var(--text);">—</p>
      <p id="menu-role"
         style="font-size:0.8rem;color:var(--muted);">—</p>
    </div>
    <div style="text-align:right;">
      <p style="font-size:0.75rem;font-weight:700;color:var(--text);">Versão 1.0.0</p>
      <p style="font-size:0.7rem;color:var(--muted);">IFPR Reagentes</p>
    </div>
  </div>

  <!-- Grid de opções -->
  <div id="menu-grid"
       style="display:grid;grid-template-columns:repeat(3,1fr);
              gap:14px;padding:20px 16px 32px;">
  </div>

  <p id="menu-feedback"
     style="text-align:center;padding:0 16px 16px;font-size:0.85rem;
            color:var(--green);min-height:20px;"></p>

  <!-- Input oculto pro restore -->
  <input type="file" id="restore-file" accept=".json" hidden>
</div>
