<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sobre o App</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    [hidden] { display: none !important; }

    body {
      background: var(--gray);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
    }

    .about-header {
      width: 100%;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      border-bottom: 1px solid #eee;
    }

    .about-back {
      font-size: 1.4rem;
      color: var(--text);
      text-decoration: none;
      line-height: 1;
    }

    .about-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 48px 24px;
      gap: 12px;
      text-align: center;
    }

    .about-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    .about-appname {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 8px;
    }

    .about-version {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .about-ifpr {
      width: 80px;
      object-fit: contain;
      margin-top: 32px;
    }
  </style>
</head>
<body>

  <div class="about-header">
    <a href="javascript:history.back()" class="about-back">←</a>
  </div>

  <div class="about-body">
    <img src="../img/icons/logo.png" alt="Logo" class="about-logo">
    <p class="about-appname">ITR App</p>
    <p class="about-version">Versão 0.4.0</p>
    <img src="../img/icons/ifpr.png" alt="IFPR" class="about-ifpr">
  </div>

</body>
</html>
