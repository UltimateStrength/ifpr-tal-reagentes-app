<div id="page-home">

  <div style="background:linear-gradient(to bottom, var(--green-dark), var(--green));
              padding:170px 20px 56px;text-align:center;">
    <h1 id="home-greeting"
        style="font-size:1.6rem;font-weight:800;color:var(--white);">
      Carregando...
    </h1>
  </div>

  <div style="padding:0 16px 32px;margin-top:-32px;">

    <div class="card" style="margin-bottom:16px;">
      <p style="font-size:0.75rem;font-weight:700;color:var(--muted);
                text-transform:uppercase;letter-spacing:0.06em;
                margin-bottom:14px;">
        Reagentes
      </p>
      <div style="display:flex;justify-content:space-around;text-align:center;">
        <button class="home-ind" data-kind="total"
                style="background:none;border:none;cursor:pointer;font-family:inherit;">
          <p id="ind-total"
             style="font-size:2rem;font-weight:800;color:var(--text);">—</p>
          <p style="font-size:0.72rem;font-weight:600;color:var(--muted);">TOTAL</p>
        </button>
        <div style="width:1px;background:var(--card-bg);"></div>
        <button class="home-ind" data-kind="soon"
                style="background:none;border:none;cursor:pointer;font-family:inherit;">
          <p id="ind-soon"
             style="font-size:2rem;font-weight:800;color:#e07b00;">—</p>
          <p style="font-size:0.72rem;font-weight:600;color:var(--muted);">P/VENCER</p>
        </button>
        <div style="width:1px;background:var(--card-bg);"></div>
        <button class="home-ind" data-kind="expired"
                style="background:none;border:none;cursor:pointer;font-family:inherit;">
          <p id="ind-expired"
             style="font-size:2rem;font-weight:800;color:var(--red);">—</p>
          <p style="font-size:0.72rem;font-weight:600;color:var(--muted);">VENCIDO</p>
        </button>
      </div>
    </div>

    <div class="card">
      <p style="font-size:0.75rem;font-weight:700;color:var(--muted);
                text-transform:uppercase;letter-spacing:0.06em;
                margin-bottom:12px;border-bottom:2px solid var(--card-bg);
                padding-bottom:8px;">
        Últimos adicionados
      </p>
      <div id="recent-list">
        <div class="empty-state" style="padding:20px;">
          Nenhum reagente ainda.
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Modal de detalhe dos indicadores (total / p-vencer / vencido) -->
<div class="modal-overlay" id="home-detail-modal" hidden>
  <div class="modal-box">
    <p class="modal-title" id="home-detail-title">Detalhe</p>
    <div id="home-detail-list" style="margin-bottom:16px;"></div>
    <button id="home-detail-close"
            style="width:100%;padding:10px;background:none;
                   border:none;color:var(--muted);font-size:0.85rem;cursor:pointer;">
      Fechar
    </button>
  </div>
</div>
