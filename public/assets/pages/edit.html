<div id="edit-container">

  <div id="page-edit">

    <!-- Degradê com título no fim -->
    <div style="background:linear-gradient(to bottom, var(--green-dark), var(--green));
                padding:170px 20px 32px;text-align:center;">
      <p style="font-size:1.6rem;font-weight:800;color:var(--white);
                line-height:1.3;">
        O que você<br>deseja fazer?
      </p>
    </div>

<div style="display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            gap:18px;
            min-height:calc(100dvh - 420px);
            padding:0 32px;">

  <button class="btn-primary" id="edit-btn-criar"
          style="width:80%;padding:18px;font-size:1.1rem;
                 background:var(--white);color:var(--green);
                 box-shadow:0 3px 10px rgba(0,0,0,0.12);">
    Criar
  </button>

  <button class="btn-primary" id="edit-btn-editar"
          style="width:80%;padding:18px;font-size:1.1rem;
                 transform:translateX(20px);
                 background:var(--white);color:var(--green);
                 box-shadow:0 3px 10px rgba(0,0,0,0.12);">
    Editar
  </button>

  <button class="btn-danger" id="edit-btn-deletar"
          style="width:80%;padding:18px;font-size:1.1rem;
                 box-shadow:0 3px 10px rgba(0,0,0,0.12);">
    Remover
  </button>

</div>
  </div>

  <!-- Painel criar -->
  <div id="panel-criar" hidden>
    <div style="display:flex;align-items:center;gap:12px;padding:16px;
                background:var(--white);border-bottom:1px solid var(--card-bg);">
      <button id="criar-close"
              style="font-size:1.4rem;color:var(--text);line-height:1;
                     background:none;border:none;cursor:pointer;">✕</button>
      <p style="font-size:1rem;font-weight:700;">Novo reagente</p>
    </div>
    <div style="padding:20px 16px 32px;">
      <div class="form-group">
        <label for="c-name">Nome do reagente</label>
        <input type="text" id="c-name"
               placeholder="ex: Álcool Etílico" autocomplete="off">
        <div id="c-suggestions"
             style="display:none;background:var(--white);
                    border:1px solid #ddd;border-radius:var(--radius-sm);
                    overflow:hidden;margin-top:2px;
                    box-shadow:0 2px 8px rgba(0,0,0,0.1);"></div>
      </div>
      <div class="form-group">
        <label for="c-number">Número de referência</label>
        <div style="display:flex;gap:10px;align-items:center;">
          <input type="number" id="c-number" min="1" step="1" disabled style="flex:1;">
          <label for="c-number-unlock"
                 style="display:flex;align-items:center;gap:6px;
                        font-size:0.8rem;font-weight:400;white-space:nowrap;margin:0;">
            <input type="checkbox" id="c-number-unlock" style="width:16px;height:16px;">
            editar manualmente
          </label>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:2;">
          <label for="c-qty">Quantidade</label>
          <input type="number" id="c-qty" min="0.01" step="0.01" placeholder="1">
        </div>
        <div class="form-group" style="flex:1;">
          <label for="c-unit">Unidade</label>
          <select id="c-unit">
            <option value="un">un</option>
            <option value="L">L</option>
            <option value="mL">mL</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="mg">mg</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="c-expiry">Data de validade</label>
        <input type="date" id="c-expiry">
      </div>
      <div class="form-group">
        <label for="c-arrival">Data de chegada</label>
        <input type="date" id="c-arrival">
      </div>
            <div class="form-group">
        <label for="c-cas">CAS <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <input type="text" id="c-cas" placeholder="ex: 64-17-5" autocomplete="off">
      </div>

      <div class="form-group form-check">
        <input type="checkbox" id="c-pf">
        <label for="c-pf">Controlado pela Polícia Federal</label>
      </div>

      <div style="display:flex;gap:10px;">
        <div class="form-group" style="flex:1;">
          <label for="c-armario">Armário <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
          <select id="c-armario">
            <option value="">—</option>
          </select>
        </div>
        <div class="form-group" style="flex:1;">
          <label for="c-situacao">Situação <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
          <select id="c-situacao">
            <option value="">—</option>
            <option value="fechado">Fechado</option>
            <option value="aberto">Aberto</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="c-local">Local atual <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <input type="text" id="c-local" placeholder="ex: Sala de reagentes" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="c-marca">Marca <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <input type="text" id="c-marca" placeholder="ex: Reatec" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="c-tags">Tags <span style="color:var(--muted);font-weight:400;">(opcional, separadas por vírgula)</span></label>
        <input type="text" id="c-tags" placeholder="ex: inflamável, uso frequente" autocomplete="off">
        <div id="c-tags-suggestions"
             style="display:none;background:var(--white);
                    border:1px solid #ddd;border-radius:var(--radius-sm);
                    overflow:hidden;margin-top:2px;
                    box-shadow:0 2px 8px rgba(0,0,0,0.1);"></div>
      </div>
    
      <div class="form-group">
        <label for="c-obs">Observações <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <textarea id="c-obs" rows="3" style="width:100%;padding:12px;border-radius:var(--radius-sm);
                  font-family:inherit;font-size:0.95rem;border:2px solid transparent;
                  background:var(--card-bg);resize:vertical;"></textarea>
      </div>

      <div class="form-group">
        <label for="c-incompat">Incompatibilidades <span style="color:var(--muted);font-weight:400;">(opcional)</span></label>
        <textarea id="c-incompat" rows="2" placeholder="ex: não misturar com ácidos fortes"
                  style="width:100%;padding:12px;border-radius:var(--radius-sm);
                  font-family:inherit;font-size:0.95rem;border:2px solid transparent;
                  background:var(--card-bg);resize:vertical;"></textarea>
      </div>
      <button class="btn-primary" id="btn-criar-confirmar">criar</button>
      <p id="criar-feedback"
         style="text-align:center;margin-top:10px;
                font-size:0.85rem;min-height:18px;"></p>
    </div>
  </div>

  <!-- Painel editar -->
  <div id="panel-editar" hidden>
    <div style="display:flex;align-items:center;gap:12px;padding:16px;
                background:var(--white);border-bottom:1px solid var(--card-bg);">
      <button id="editar-close"
              style="font-size:1.4rem;color:var(--text);line-height:1;
                     background:none;border:none;cursor:pointer;">✕</button>
      <p style="font-size:1rem;font-weight:700;">Editar</p>
    </div>
    <div style="padding:16px;">
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input type="text" id="edit-search"
               placeholder="buscar substância..."
               style="flex:1;background:var(--card-bg);padding:11px 12px;
                      border-radius:var(--radius-sm);font-size:0.95rem;
                      border:2px solid transparent;">
        <button class="btn-primary" id="edit-search-btn"
                style="width:auto;padding:0 16px;">Buscar</button>
      </div>
      <div id="edit-results"></div>
    </div>
  </div>

  <!-- Painel deletar -->
  <div id="panel-deletar" hidden>
    <div style="display:flex;align-items:center;gap:12px;padding:16px;
                background:var(--white);border-bottom:1px solid var(--card-bg);">
      <button id="deletar-close"
              style="font-size:1.4rem;color:var(--text);line-height:1;
                     background:none;border:none;cursor:pointer;">✕</button>
      <p style="font-size:1rem;font-weight:700;">Remover</p>
    </div>
    <div style="padding:16px;">
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <input type="text" id="delete-search"
               placeholder="buscar substância..."
               style="flex:1;background:var(--card-bg);padding:11px 12px;
                      border-radius:var(--radius-sm);font-size:0.95rem;
                      border:2px solid transparent;">
        <button class="btn-primary" id="delete-search-btn"
                style="width:auto;padding:0 16px;">Buscar</button>
      </div>
      <div id="delete-results"></div>
    </div>
  </div>

</div>
